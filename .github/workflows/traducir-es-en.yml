name: Traducir ES → EN
on:
  push:
    paths:
      - 'src/content/docs/**/*.md'
      - 'src/content/docs/**/*.mdx'
      - '!src/content/docs/en/**'
  workflow_dispatch:

jobs:
  traducir:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar traductor
        run: npm install -g ai-markdown-translator

      - name: Ejecutar traducción
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ai-markdown-translator \
            -i ./src/content/docs \
            -o ./src/content/docs/en \
            --language en \
            --model gemini/gemini-2.0-flash \
            --preserve-structure \
            --code-blocks ignore \
            --frontmatter-keep slug,date,tags,category,hero,image,title \
            --prompt "Eres traductor para documentacion Astro Starlight. Solo traduce el contenido visible. Mantiene intactos: rutas, slugs, nombres de carpetas como apps informes-de-predicacion territorios villas-oriente, nombres de archivos, bloques de codigo, frontmatter y enlaces. Tono claro tecnico profesional."

      - name: Subir cambios
        run: |
          git config --local user.email "bot@tudominio.com"
          git config --local user.name "Traductor Automatico"
          git add ./src/content/docs/en/
          git commit -m "Traduccion ES → EN" || true
          git push
