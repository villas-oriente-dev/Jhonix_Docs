name: Traducir ES → EN
on:
  push:
    paths:
      - 'src/content/docs/**/*.md'
      - 'src/content/docs/**/*.mdx'
      - '!src/content/docs/en/**'
  workflow_dispatch:

jobs:
  traducir:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar traductor
        run: npm install -g ai-markdown-translator

      - name: Ejecutar traducción
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PROMPT="Eres traductor para documentación de Astro Starlight.
          ESTRUCTURA:
          - Origen: ./src/content/docs/ (ES)
          - Destino: ./src/content/docs/en/ (EN)
          - Mantener jerarquía exacta de carpetas y archivos.
          - Carpetas como apps, informes-de-predicacion, territorios, villas-oriente SIN CAMBIOS.
          REGLAS:
          1. NO traducir: nombres de proyectos, rutas, slugs, códigos, comandos.
          2. Nombres de archivos iguales: index.mdx → index.mdx.
          3. Frontmatter: slug, date, tags, title INTACTOS.
          4. Bloques de código entre ``` SIN CAMBIOS.
          5. Enlaces: rutas sin traducir.
          6. Solo traducir el texto visible.
          Tono: claro, técnico, profesional."
          
          ai-markdown-translator \
            -i ./src/content/docs \
            -o ./src/content/docs/en \
            --from es \
            --to en \
            --model gemini/gemini-2.0-flash \
            --preserve-structure \
            --code-blocks ignore \
            --frontmatter-keep slug,date,tags,category,hero,image,title \
            --prompt "$PROMPT"

      - name: Subir archivos traducidos
        run: |
          git config --local user.email "bot@tudominio.com"
          git config --local user.name "Traductor Automático"
          git add ./src/content/docs/en/
          git commit -m "🤖 Traducción ES → EN" || echo "Sin cambios nuevos"
          git push
