name: Traducir ES → EN
on:
  push:
    paths:
      - 'src/content/docs/**/*.md'
      - 'src/content/docs/**/*.mdx'
      - '!src/content/docs/en/**'
  workflow_dispatch:

jobs:
  traducir:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar traductor
        run: npm install -g ai-markdown-translator

      - name: Ejecutar traducción
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "📁 Archivos de origen:"
          ls -la ./src/content/docs/
          
          ai-markdown-translator \
            -i ./src/content/docs \
            -o ./src/content/docs/en \
            --language en \
            --model gemini/gemini-2.0-flash \
            --preserve-structure \
            --code-blocks ignore \
            --frontmatter-keep slug,date,tags,category,hero,image,title \
            --prompt "Eres traductor para documentacion Astro Starlight. Solo traduce el contenido visible. Mantiene intactos: rutas, slugs, nombres de carpetas como apps informes-de-predicacion territorios villas-oriente, nombres de archivos, bloques de codigo, frontmatter y enlaces. Tono claro tecnico profesional."

          echo "✅ Traducción finalizada. Contenido de salida:"
          ls -la ./src/content/docs/en/ || echo "⚠️ Carpeta no creada"

      - name: Subir cambios
        run: |
          git config --local user.email "actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          echo "📁 Estado de archivos:"
          ls -la ./src/content/docs/
          
          git add ./src/content/docs/en/
          
          if git diff --staged --quiet; then
            echo "ℹ️ No hay cambios nuevos para subir"
          else
            git commit -m "📝 Traducción ES → EN"
            git push
          fi
